<!DOCTYPE html>
<html>

<head>

<title>Edit Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

<h2>Edit Student</h2>

<form method="POST">

<input
type="text"
name="name"
value="{{ student.name }}"
class="form-control mb-2"
>

<input
type="email"
name="email"
value="{{ student.email }}"
class="form-control mb-2"
>

<button class="btn btn-success">
Update Student
</button>

</form>

</body>

</html>
