{% extends "base.html" %}

{% block content %}

<h2>Edit Student</h2>

<form method="POST">

<input
type="text"
name="name"
value="{{ student.name }}"
class="form-control mb-2"
>

<input
type="email"
name="email"
value="{{ student.email }}"
class="form-control mb-2"
>

<button class="btn btn-success">
Update Student
</button>

</form>

{% endblock %}
